[project]
name = "password-generator-api"
version = "1.0.0"
description = "REST API for generating secure passwords"
requires-python = ">3.12"
dependencies = [
    "fastapi[standard]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
