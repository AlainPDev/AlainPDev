[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-sentinel"
version = "0.1.0"
description = "Async port scanner (offensive) + auth-log brute-force detector (defensive) in one CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT"}

[project.scripts]
sentinel = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
